<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Alimentar | Criar Conta</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <linkb rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/autenticacao.css">
</head>
<ody>

    <main class="area-login">
        <div class="card-login">
            <h1 class="titulo-login">Criar Conta</h1>
            
            <form action="#" class="formulario-login">
                <input type="text" class="campo-texto" placeholder="CNPJ:" required>
                <input type="text" class="campo-texto" placeholder="Nome da Empresa/ONG" required>
                
                <select class="campo-texto campo-select" required>
                    <option value="" disabled selected>Escolha uma opção</option>
                    <option value="empresa">Empresa (Doador)</option>
                    <option value="ong">ONG (Receptor)</option>
                </select>

                <input type="email" class="campo-texto" placeholder="E-mail: exemplo@gmail.com" required>
                <input type="password" class="campo-texto" placeholder="Senha:" required>
                
                <button type="submit" class="btn-enviar">Criar</button>
            </form>

            <a href="login.html" class="link-mudar-pagina">Já tem cadastro? Clique aqui</a>
        </div>
    </main>

</body>
</html>
