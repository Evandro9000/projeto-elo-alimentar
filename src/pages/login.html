<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Alimentar | Login</title>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/autenticacao.css">
</head>
<body>

    <main class="area-login">
        <div class="card-login">
            <h1 class="titulo-login">Login</h1>
            
            <!-- Mensagens de Feedback -->
            <div id="mensagem-sucesso" class="alerta alerta-sucesso oculto" aria-live="polite">
                Login realizado com sucesso! Redirecionando...
            </div>

            <div id="resumo-erros" class="alerta alerta-erro oculto" aria-live="assertive">
                <strong>Atenção:</strong> Preencha os campos corretamente.
            </div>

            <form id="form-login" class="formulario-login" novalidate>
                
                <!-- CNPJ -->
                <div class="form-group" style="text-align: left;">
                    <input type="text" id="cnpj-login" class="campo-texto" placeholder="CNPJ:" required>
                    <span id="erro-cnpj-login" class="erro-msg"></span>
                </div>

                <!-- Senha -->
                <div class="form-group" style="text-align: left;">
                    <input type="password" id="senha-login" class="campo-texto" placeholder="Senha:" required>
                    <span id="erro-senha-login" class="erro-msg"></span>
                </div>
                
                <button type="submit" id="btn-entrar" class="btn-enviar" disabled>Entrar</button>
            </form>

            <a href="cadastro.html" class="link-mudar-pagina">Criar uma conta</a>
        </div>
    </main>

    <script src="../utils/scriptLogin.js"></script>
</body>
</html>
