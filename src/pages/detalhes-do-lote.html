<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elo Alimentar | Detalhes do Lote</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../styles/global.css">
        <link rel="stylesheet" href="../styles/detalhesLote.css">
    </head>

    <body>
        <aside class="sidebar" aria-label="Menu Lateral">
            <div class="icones-esquerda">
                <a href="meus-lotes.html" class="basket" aria-label="Ir para o carrinho">
                    <img src="../images/Basket.svg" alt="Carrinho">
                </a>
            </div>
            
            <nav class="icones-direita" aria-label="Navegação secundária">
                <a href="Perfil.html" class="profile" aria-label="Meu Perfil">
                    <img src="../images/Perfil.svg" alt="Perfil">
                </a>
                <a href="login.html" class="logout" aria-label="Sair da conta">
                    <img src="../images/logout.svg" alt="Sair">
                </a>
            </nav>
        </aside>

        <main class="area">
            <a href="Área restrita ONG-mercado.html" class="btn-voltar" aria-label="Voltar">
                <img src="../images/Seta.svg" alt="Voltar">
            </a>

            <div class="card-lote">
                <figure class="foto">
                    <img src="../images/tomate.png" alt="Tomates frescos">
                </figure>

                <p class="local-lote"><b>Local</b>: Supermercado da Lontra</p>

                <p class="informacoes">
                    Endereço: Rua xxxxx, nºx - CEP: xxx-xxx<br>
                    Produto: Tomate e Tomate cereja<br>
                    Quantidade: 5kg<br>
                    Tipo de entrega: Retirada no local<br>
                    Código do lote: xxxx-xxxxxx
                </p>
                
                <div class="card-botao">
                    <button class="add">Adicionar Lote</button>
                </div>

            </div>
        </main>
    </body>
</html>
