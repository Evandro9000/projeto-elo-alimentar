<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Alimentar | Dashboard</title>

    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/global.css">
</head>

<body>
    <div class="layout">

        <!-- Menu lateral -->
        <aside class="sidebar">
            <div class="menu-icon">☰</div>

            <nav class="menu">
               
            <a href="dashboard.html" class="menu-item">
                <img src="https://cdn-icons-png.flaticon.com/128/1828/1828765.png" alt="Ícone Dashboard" class="icone-dashboard">
                <span>Dashboard</span>
             </a>


            <a href="criar-doacao.html" class="menu-item">
                <img src="../images/criar-doacao.svg" alt="Criar doação" class="icone-criar-doacao">
                <span>Criar doação</span>
            </a>

            <a href="gerenciar-doacoes.html" class="menu-item">
                <img src="../images/gerenciar-doacoes.svg" alt="Gerenciar doação" class="icone-gerenciar-doacao">
                <span>Gerenciar doações</span>
            </a>

            </nav>
        </aside>

        <!-- Conteúdo principal -->
        <main class="main-content">

            <!-- Cabeçalho -->
            <header class="header">
                <a href="Perfil.html" class="perfil" aria-label="Meu perfil">
                    <img src="../images/Perfil.svg" alt="">
                    <span>Meu perfil</span>
                </a>

                <div class="welcome">
                    <h1>Olá Supermercado....</h1>
                    <p>Juntos contra o desperdício de alimentos!</p>
                </div>
            </header>

            <!-- Título do dashboard -->
            <section class="page-title">
                <a href="#" class="back-button" aria-label="Voltar">❮</a>
                <h2>DASHBOARD</h2>
            </section>

            <!-- Indicadores -->
            <section class="stats">

                <article class="stat-card donations">
                    <div class="stat-top">
                        <h3>TOTAL DE DOAÇÕES</h3>
                        <span class="stat-icon">📊</span>
                    </div>
                    <p class="stat-number" id="total-doacoes">0KG</p>
                </article>

                <article class="stat-card ngos">
                    <div class="stat-top">
                        <h3>ONGs ATENDIDAS</h3>
                        <span class="round-icon">🤲</span>
                    </div>
                   <p class="stat-number" id="ongs-atendidas">0</p>
                    <span class="decoration">♡</span>
                </article>

                <article class="stat-card collection">
                    <div class="stat-top">
                        <h3>EM COLETA</h3>
                        <span class="stat-icon">🚚</span>
                    </div>
                 <p class="stat-number" id="em-coleta">0</p>
                    <span class="basket">🛒</span>
                </article>

            </section>

            <!-- Últimas coletas -->
            <section class="collections">
                <div class="section-heading">
                    <h2>Últimas coletas</h2>
                    <a href="#todas-coletas" class="view-all mobile-view-all">
                        Ver todas ↗
                    </a>
                </div>

                <div class="collections-panel" id="todas-coletas">

                    <div class="collections-panel" id="todas-coletas">

    <a href="gerenciar-doacoes.html" class="view-all desktop-view-all">
        Ver todas <span>↗</span>
    </a>

</div>
            </section>

            <footer class="footer">
                <p>Elo Alimentar © 2026 — Juntos contra o desperdício.</p>
            </footer>

        </main>
    </div>
   <script src="../utils/doacão.js"></script>
    <script src="../utils/dashboard.js"></script>
</body>
</html>
</body>
</html>
